name: mobile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the builds to this GitHub release, e.g. v0.15.1 (empty: only keep them as workflow artifacts). It is created if it does not exist."
        type: string
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "apps/wordcraft-mobile/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Runner sudah punya Android SDK. Tidak pakai android-actions/setup-android (gagal di runner ini).
      - name: Install the NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-30" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - run: cargo install cargo-apk --locked
      # With the ANDROID_KEYSTORE_BASE64 secret: a signed release APK. Without it: a debug APK
      # (signed with the debug key; installs as is, but is not for a store).
      - name: Build the APK
        working-directory: apps/wordcraft-mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            cargo apk build --release
          else
            cargo apk build
          fi
      - name: Collect the APK
        run: |
          mkdir dist
          apk=$(find target -path '*/apk/*.apk' | head -n 1)
          cp "$apk" "dist/NovaWrite-${TAG:-dev}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: novawrite-android-apk
          path: dist/*.apk
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "NovaWrite $TAG" --notes "NovaWrite $TAG"
          gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
