name: mobile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the builds to this GitHub release, e.g. v0.15.1 (empty: only keep them as workflow artifacts). It is created if it does not exist."
        type: string
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "apps/wordcraft-mobile/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # Versi dari tag (v0.2.0 -> 0.2.0). cargo-apk memakai versi paket Cargo untuk versionName dan
      # versionCode APK (dan menolak version_name/version_code di TOML), jadi versi workspace diganti di sini.
      # Dibaca juga oleh app (NOVAWRITE_VERSION) untuk membandingkan dengan release terbaru.
      # Tanpa tag: 0.0.0-dev (app akan menawarkan update ke rilis terbaru).
      - name: Set the version
        run: |
          if [ -n "$TAG" ]; then V="${TAG#v}"; else V="0.0.0-dev"; fi
          echo "NOVAWRITE_VERSION=$V" >> "$GITHUB_ENV"
          sed -i '0,/^version = ".*"/s//version = "'"$V"'"/' Cargo.toml
          grep -n '^version' Cargo.toml | head -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Runner sudah punya Android SDK. Tidak pakai android-actions/setup-android (gagal di runner ini).
      - name: Install the NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-30" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      # cargo-apk disimpan di cache supaya tidak dikompilasi ulang tiap run.
      - uses: actions/cache@v4
        id: apk-tool
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-0.10.0-${{ runner.os }}
      - if: steps.apk-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --version 0.10.0 --locked
      # Selalu build release (opt 3, simbol dibuang): build dev menghasilkan APK 250 MB lebih.
      # Dengan secret ANDROID_KEYSTORE_BASE64: ditandatangani dengan kunci tetapmu (bisa update di atas versi lama).
      # Tanpa secret: kunci sementara dibuat di sini. APK bisa dipasang, tapi kuncinya beda tiap build,
      # jadi hapus dulu versi lama sebelum memasang yang baru.
      - name: Build the APK
        working-directory: apps/wordcraft-mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          else
            echo "::warning title=Kunci sementara::Secret ANDROID_KEYSTORE_BASE64 belum diisi. APK ini memakai kunci sementara: versi lama harus dicopot dulu sebelum memasangnya."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass android -keypass android \
              -alias novawrite -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NovaWrite CI"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          fi
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          cargo apk build --release
      - name: Inspect the APK
        run: |
          apk=$(find target -path '*/apk/wordcraft_mobile.apk' | head -n 1)  # file akhir yang sudah ditandatangani, bukan *-unaligned.apk
          [ -n "$apk" ] || { echo "APK akhir tidak ditemukan:"; find target -path '*/apk/*.apk'; exit 1; }
          ls -l "$apk"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging "$apk" | grep -E "^package|sdkVersion|targetSdkVersion|application-icon|launchable-activity|native-code" || true
          # gagal kalau APK belum ditandatangani (HP menolaknya dengan "Aplikasi tidak terinstal")
          "$BT/apksigner" verify --verbose --print-certs "$apk"
          # gagal kalau ikon atau pustaka native tidak ikut
          "$BT/aapt" dump badging "$apk" | grep -q "application-icon" || { echo "APK tanpa ikon"; exit 1; }
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libwordcraft_mobile.so" || { echo "APK tanpa libwordcraft_mobile.so"; exit 1; }
      - name: Collect the APK
        run: |
          mkdir dist
          apk=$(find target -path '*/apk/wordcraft_mobile.apk' | head -n 1)  # file akhir yang sudah ditandatangani, bukan *-unaligned.apk
          [ -n "$apk" ] || { echo "APK akhir tidak ditemukan:"; find target -path '*/apk/*.apk'; exit 1; }
          cp "$apk" "dist/NovaWrite-${TAG:-dev}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: novawrite-android-apk
          path: dist/*.apk
      # Isi release = bagian CHANGELOG.md untuk tag ini; cadangan: bagian "Belum dirilis".
      - name: Release notes (from CHANGELOG.md)
        if: env.TAG != ''
        run: |
          awk -v t="## $TAG" 'index($0,t)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || awk '/^## Belum dirilis/{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "NovaWrite $TAG" > release-notes.md
          cat release-notes.md
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "NovaWrite $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
